<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="贵金属追踪">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="实时追踪国内黄金、白银等贵金属价格">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <title>贵金属价格追踪</title>
    <script src="/js/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            padding-top: env(safe-area-inset-top, 15px);
            padding-bottom: env(safe-area-inset-bottom, 15px);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .metal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 5px;
        }

        .metal-tab {
            flex: 1;
            min-width: 80px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .metal-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .metal-tab:active {
            transform: scale(0.95);
        }

        .price-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .price-label {
            font-size: 1em;
            color: #666;
            margin-bottom: 10px;
        }

        .price-value {
            font-size: 2.8em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .price-change {
            font-size: 1.1em;
            font-weight: 600;
            margin-top: 8px;
        }

        .price-change.up {
            color: #10b981;
        }

        .price-change.down {
            color: #ef4444;
        }

        .price-change.neutral {
            color: #6b7280;
        }

        .chart-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .chart-tab {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chart-tab.active {
            background: white;
            color: #667eea;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chart-title {
            font-size: 1.1em;
            color: #333;
            font-weight: 600;
        }

        .last-update {
            color: #666;
            font-size: 0.75em;
        }

        .info-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .info-item {
            text-align: center;
            padding: 10px 5px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .info-label {
            color: #666;
            font-size: 0.7em;
            margin-bottom: 4px;
        }

        .info-value {
            color: #333;
            font-size: 0.9em;
            font-weight: 600;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        .refresh-btn {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 20px));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .refresh-btn:active {
            transform: scale(0.9);
        }

        .refresh-btn.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .offline-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ef4444;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 0.85em;
            display: none;
            z-index: 1000;
        }

        .offline-indicator.show {
            display: block;
        }

        @media (max-width: 360px) {
            .info-card {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .price-value {
                font-size: 2.2em;
            }
        }
    </style>
</head>
<body>
    <div class="offline-indicator" id="offlineIndicator">网络已断开，显示缓存数据</div>
    
    <div class="container">
        <div class="header">
            <h1>贵金属价格追踪</h1>
            <p>上海期货交易所实时行情</p>
        </div>

        <div class="metal-tabs">
            <button class="metal-tab active" data-metal="gold">🥇 黄金</button>
            <button class="metal-tab" data-metal="silver">🥈 白银</button>
            <button class="metal-tab" data-metal="platinum">⚪ 铂金</button>
            <button class="metal-tab" data-metal="palladium">🔵 钯金</button>
        </div>

        <div class="price-card">
            <div class="price-label" id="metalName">黄金价格</div>
            <div class="price-value" id="currentPrice">加载中...</div>
            <div class="price-change" id="priceChange">--</div>
        </div>

        <div class="chart-tabs">
            <button class="chart-tab active" data-chart="daily">日K线</button>
            <button class="chart-tab" data-chart="monthly">月K线</button>
            <button class="chart-tab" data-chart="today">今日走势</button>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <div class="chart-title" id="chartTitle">日K线图</div>
                <div class="last-update" id="lastUpdate">--</div>
            </div>
            <canvas id="priceChart"></canvas>
        </div>

        <div class="info-card">
            <div class="info-item">
                <div class="info-label">今开</div>
                <div class="info-value" id="open">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">最高</div>
                <div class="info-value" id="high">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">最低</div>
                <div class="info-value" id="low">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">昨收</div>
                <div class="info-value" id="closePrev">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">成交量</div>
                <div class="info-value" id="volume">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">合约</div>
                <div class="info-value" id="code">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">货币</div>
                <div class="info-value" id="currency">CNY</div>
            </div>
            <div class="info-item">
                <div class="info-label">单位</div>
                <div class="info-value" id="unit">g</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" id="refreshBtn" title="刷新">↻</button>

    <script>
        const METALS = {
            gold: {
                name: '黄金',
                secid: '113.AU2606',
                unit: 'g',
                icon: '🥇'
            },
            silver: {
                name: '白银',
                secid: '113.AG2606',
                unit: 'kg',
                icon: '🥈'
            },
            platinum: {
                name: '铂金',
                secid: '113.SP2606',
                unit: 'g',
                icon: '⚪'
            },
            palladium: {
                name: '钯金',
                secid: '113.PD2606',
                unit: 'g',
                icon: '🔵'
            }
        };

        let currentMetal = 'gold';
        let currentChartType = 'daily';
        let priceChart = null;
        let previousPrice = null;

        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '价格',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: ctx => `价格: ¥${ctx.parsed.y.toFixed(2)}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            ticks: { maxTicksLimit: 8, font: { size: 10 } }
                        },
                        y: {
                            display: true,
                            ticks: {
                                callback: v => '¥' + v.toFixed(2),
                                font: { size: 10 }
                            }
                        }
                    }
                }
            });
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleDateString('zh-CN', {
                month: '2-digit',
                day: '2-digit'
            });
        }

        function updatePriceChange(data) {
            const el = document.getElementById('priceChange');
            if (data.price_change !== undefined && data.price_change_percent !== undefined) {
                const change = data.price_change;
                const pct = data.price_change_percent;
                if (change > 0) {
                    el.textContent = `↑ +${change.toFixed(2)} (+${pct.toFixed(2)}%)`;
                    el.className = 'price-change up';
                } else if (change < 0) {
                    el.textContent = `↓ ${change.toFixed(2)} (${pct.toFixed(2)}%)`;
                    el.className = 'price-change down';
                } else {
                    el.textContent = '→ 0.00 (0.00%)';
                    el.className = 'price-change neutral';
                }
            } else {
                el.textContent = '--';
                el.className = 'price-change neutral';
            }
        }

        async function fetchPrice() {
            const metal = METALS[currentMetal];
            try {
                const fields = 'f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f57,f58,f60,f107,f116,f117,f152,f168,f169,f170,f171,f161,f162,f163,f164,f165,f166,f167';
                const response = await fetch(`https://push2.eastmoney.com/api/qt/stock/get?secid=${metal.secid}&fields=${fields}`, {
                    headers: {
                        'User-Agent': 'Mozilla/5.0',
                        'Referer': 'https://quote.eastmoney.com/'
                    }
                });
                const data = await response.json();
                
                if (data.rc === 0 && data.data) {
                    const priceDataRaw = data.data;
                    const price = priceDataRaw.f43 / 100;
                    const priceChange = priceDataRaw.f169 / 100;
                    const priceChangePercent = priceDataRaw.f170 / 100;
                    const closePrev = price - priceChange;
                    
                    const priceData = {
                        timestamp: Date.now(),
                        price: price,
                        price_change: priceChange,
                        price_change_percent: priceChangePercent,
                        currency: 'CNY',
                        unit: metal.unit,
                        high: priceDataRaw.f44 / 100,
                        low: priceDataRaw.f45 / 100,
                        open: priceDataRaw.f46 / 100,
                        close_prev: closePrev,
                        volume: priceDataRaw.f49,
                        code: priceDataRaw.f57,
                        name: metal.name
                    };
                    
                    document.getElementById('metalName').textContent = `${metal.icon} ${metal.name}价格`;
                    document.getElementById('currentPrice').textContent = `¥${priceData.price.toFixed(2)}`;
                    document.getElementById('currency').textContent = priceData.currency || 'CNY';
                    document.getElementById('unit').textContent = priceData.unit || metal.unit;
                    document.getElementById('lastUpdate').textContent = `更新于 ${formatTime(priceData.timestamp)}`;
                    
                    if (priceData.code) {
                        document.getElementById('code').textContent = priceData.code;
                    }
                    if (priceData.open !== undefined) {
                        document.getElementById('open').textContent = `¥${priceData.open.toFixed(2)}`;
                    }
                    if (priceData.high !== undefined) {
                        document.getElementById('high').textContent = `¥${priceData.high.toFixed(2)}`;
                    }
                    if (priceData.low !== undefined) {
                        document.getElementById('low').textContent = `¥${priceData.low.toFixed(2)}`;
                    }
                    if (priceData.close_prev !== undefined) {
                        document.getElementById('closePrev').textContent = `¥${priceData.close_prev.toFixed(2)}`;
                    }
                    if (priceData.volume !== undefined) {
                        document.getElementById('volume').textContent = (priceData.volume / 10000).toFixed(1) + '万';
                    }

                    updatePriceChange(priceData);
                    previousPrice = priceData.price;
                }
            } catch (error) {
                console.error('Error fetching price:', error);
                useMockPrice();
            }
        }

        async function fetchChart() {
            const metal = METALS[currentMetal];
            let url = '';
            let chartTitle = '';

            switch (currentChartType) {
                case 'daily':
                    url = getKlineUrl(metal, 101, 60);
                    chartTitle = `${metal.name}日K线图`;
                    break;
                case 'monthly':
                    url = getKlineUrl(metal, 101, 365);
                    chartTitle = `${metal.name}月K线图`;
                    break;
                case 'today':
                    url = getKlineUrl(metal, 60, 1);
                    chartTitle = `${metal.name}今日走势`;
                    break;
            }

            document.getElementById('chartTitle').textContent = chartTitle;

            try {
                const response = await fetch(url, {
                    headers: {
                        'User-Agent': 'Mozilla/5.0',
                        'Referer': 'https://quote.eastmoney.com/'
                    }
                });
                const data = await response.json();

                if (data.rc === 0 && data.data && data.data.klines) {
                    const klines = data.data.klines;
                    const chartData = klines.map(kline => {
                        const parts = kline.split(',');
                        return {
                            timestamp: new Date(parts[0]).getTime(),
                            price: parseFloat(parts[2])
                        };
                    });

                    const labels = chartData.map(item => {
                        if (currentChartType === 'today') {
                            return formatTime(item.timestamp);
                        } else {
                            return formatDate(item.timestamp);
                        }
                    });
                    const prices = chartData.map(item => item.price);

                    priceChart.data.labels = labels;
                    priceChart.data.datasets[0].data = prices;
                    priceChart.update();
                }
            } catch (error) {
                console.error('Error fetching chart:', error);
            }
        }

        function getKlineUrl(metal, klt, days) {
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - days);
            
            const endStr = startDate.toISOString().split('T')[0].replace(/-/g, '');
            const startStr = endDate.toISOString().split('T')[0].replace(/-/g, '');
            
            return `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${metal.secid}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58&klt=${klt}&fqt=1&beg=${startStr}&end=${endStr}`;
        }

        function useMockPrice() {
            const metal = METALS[currentMetal];
            const basePrices = { gold: 1113.46, silver: 195.70, platinum: 52.76, palladium: 275.09 };
            const basePrice = basePrices[currentMetal] || 100;
            
            const price = basePrice + (Math.random() - 0.5) * 10;
            const priceChange = (Math.random() - 0.5) * 5;
            const priceChangePercent = (priceChange / basePrice) * 100;
            
            const priceData = {
                timestamp: Date.now(),
                price: price,
                price_change: priceChange,
                price_change_percent: priceChangePercent,
                currency: 'CNY',
                unit: metal.unit,
                high: price + 2,
                low: price - 2,
                open: basePrice,
                close_prev: basePrice,
                volume: 100000 + Math.random() * 100000,
                code: metal.secid.split('.')[1],
                name: metal.name
            };
            
            document.getElementById('metalName').textContent = `${metal.icon} ${metal.name}价格`;
            document.getElementById('currentPrice').textContent = `¥${priceData.price.toFixed(2)}`;
            document.getElementById('currency').textContent = priceData.currency || 'CNY';
            document.getElementById('unit').textContent = priceData.unit || metal.unit;
            document.getElementById('lastUpdate').textContent = `更新于 ${formatTime(priceData.timestamp)}`;
            
            if (priceData.code) {
                document.getElementById('code').textContent = priceData.code;
            }
            if (priceData.open !== undefined) {
                document.getElementById('open').textContent = `¥${priceData.open.toFixed(2)}`;
            }
            if (priceData.high !== undefined) {
                document.getElementById('high').textContent = `¥${priceData.high.toFixed(2)}`;
            }
            if (priceData.low !== undefined) {
                document.getElementById('low').textContent = `¥${priceData.low.toFixed(2)}`;
            }
            if (priceData.close_prev !== undefined) {
                document.getElementById('closePrev').textContent = `¥${priceData.close_prev.toFixed(2)}`;
            }
            if (priceData.volume !== undefined) {
                document.getElementById('volume').textContent = (priceData.volume / 10000).toFixed(1) + '万';
            }

            updatePriceChange(priceData);
            previousPrice = priceData.price;
        }

        function refreshAll() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');
            Promise.all([fetchPrice(), fetchChart()]).finally(() => {
                btn.classList.remove('loading');
            });
        }

        document.querySelectorAll('.metal-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.metal-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMetal = tab.dataset.metal;
                refreshAll();
            });
        });

        document.querySelectorAll('.chart-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentChartType = tab.dataset.chart;
                fetchChart();
            });
        });

        document.getElementById('refreshBtn').addEventListener('click', refreshAll);

        window.addEventListener('online', () => {
            document.getElementById('offlineIndicator').classList.remove('show');
            refreshAll();
        });

        window.addEventListener('offline', () => {
            document.getElementById('offlineIndicator').classList.add('show');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }

        function init() {
            initChart();
            refreshAll();
            setInterval(fetchPrice, 60000);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
